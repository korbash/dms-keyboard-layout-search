name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Install test dependencies
        run: pacman -Syu --noconfirm git nodejs python quickshell qt6-declarative libxkbcommon xkeyboard-config make
      - uses: actions/checkout@v4
      - name: Test helper, aliases, manifests and QML lifecycle
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          make test test-component
